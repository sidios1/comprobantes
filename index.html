<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- Solo se permite cargar archivos de este mismo sitio: ningún script externo puede leer los datos. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Verificar comprobante</title>
  <style>
    /* Sistema: fuente del sistema; tamaños 14 / 16 / 22 px; pesos 400 y 600.
       Color: neutros + un acento (el azul del logo); verde y rojo solo para el resultado. */
    :root {
      --fondo: #ffffff;
      --texto: #1c1f3a;
      --secundario: #4a4e68;
      --linea: #d5d7e2;
      --acento: #1f2a8c;
      --valido: #1d6b3f;
      --invalido: #b3261e;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #1e1f24;
        --texto: #ececf1;
        --secundario: #b4b6c4;
        --linea: #3a3c46;
        --acento: #a9b3f5;
        --valido: #8fcfa9;
        --invalido: #f29b93;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--fondo); color: var(--texto);
      font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    main { max-width: 34rem; margin: 0 auto; padding: 20px 16px 32px; }
    header { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--linea); }
    header img { width: 48px; height: 48px; border-radius: 50%; background: #fff; }
    header p { margin: 0; font-weight: 600; color: var(--acento); }
    h1 { font-size: 22px; font-weight: 600; margin: 24px 0 8px; line-height: 1.3; }
    h1.valido { color: var(--valido); }
    h1.invalido { color: var(--invalido); }
    p { margin: 0 0 12px; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 16px 0 20px; }
    dt { color: var(--secundario); }
    dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
    .nota, footer { font-size: 14px; color: var(--secundario); }
    footer { margin-top: 32px; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="logo.jpg" alt="Logo del coro">
      <p id="organizacion">Tesorería del coro</p>
    </header>
    <section id="resultado" aria-live="polite">
      <noscript><h1>Activa JavaScript</h1><p>La verificación se hace en tu navegador y necesita JavaScript.</p></noscript>
      <p class="cargando">Verificando…</p>
    </section>
    <footer>La verificación se hace en tu celular con la firma digital de la tesorería. Los datos del comprobante no se envían a ningún servidor.</footer>
  </main>
  <script type="module" src="verificar.js"></script>
</body>
</html>
